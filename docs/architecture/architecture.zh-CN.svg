<text x="680" y="1013" font-family="Noto Serif SC, Noto Serif CJK SC, serif" font-size="25" font-weight="normal" fill="#233847">逐行筛选 + 条件 softmax</text>
<text x="680" y="1051" font-family="Noto Serif SC, Noto Serif CJK SC, serif" font-size="25" font-weight="normal" fill="#233847">与候选路径保持相同语义</text>
<rect x="1250" y="930" width="480" height="150" rx="14" fill="#fff9ee" stroke="#94611e" stroke-width="3" stroke-dasharray="12 8"/>
<text x="1270" y="975" font-family="Noto Serif SC, Noto Serif CJK SC, serif" font-size="30" font-weight="bold" fill="#94611e">候选 logits 对照</text>
<text x="1270" y="1013" font-family="Noto Serif SC, Noto Serif CJK SC, serif" font-size="25" font-weight="normal" fill="#233847">Eager gather / 已有融合基线</text>
<text x="1270" y="1051" font-family="Noto Serif SC, Noto Serif CJK SC, serif" font-size="25" font-weight="normal" fill="#233847">有依据后才考虑优化</text>
